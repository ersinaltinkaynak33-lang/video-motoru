name: Video Uretimi

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Video verileri (JSON)'
        required: true

# NOT: concurrency bloğu bilerek kaldırıldı. "cancel-in-progress: false" bile olsa GitHub,
# aynı gruptaki BEKLEYEN eski işleri iptal eder; arka arkaya onaylanan videolar sessizce düşerdi.
# Her iş kendi runner'ında çalıştığı için paralel çalışmanın sakıncası yok.

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"   # log sırası bozulmasın (eski logda Traceback, çıktılardan ÖNCE görünüyordu)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg Kurulumu
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          architecture: x64

      - name: Bağımlılıklar (MPT yok; yalnızca 2 paket)
        timeout-minutes: 3
        run: |
          pip install edge-tts==7.3.1 requests==2.33.1
          # Altyazı için Türkçe karakter destekli, deterministik font
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || \
            sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Ortam kontrolü (libass + loudnorm şart)
        run: |
          ffmpeg -hide_banner -filters | grep -E " ass " 
          ffmpeg -hide_banner -filters | grep -E " loudnorm "

      - name: Render + Telegram
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python render.py

      # render.py kendi hata mesajını gönderdiyse (bayrak dosyası) mükerrer bildirim atma.
      # Zaman aşımı/iptal gibi render.py'nin haber veremediği durumlarda bu adım devreye girer.
      - name: Çökme/zaman aşımı bildirimi
        if: failure() || cancelled()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
        run: |
          [ -f "${RUNNER_TEMP}/render_notified.flag" ] && exit 0
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="❌ Video işi çöktü veya iptal oldu: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
