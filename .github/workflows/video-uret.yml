name: Video Uretimi

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Video verileri (JSON)'
        required: true

concurrency:
  group: video-uret
  cancel-in-progress: false

env:
  # Tag/branch değil, commit SHA'sına sabitle
  MPT_REF: f063a2b95e0f71f60891ac1c7b53add684bc6a46

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          ref: ${{ env.MPT_REF }}
          path: mpt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mpt/requirements.txt

      # FFMPEG'İ HAZIR EKLENTİ İLE SANİYELER İÇİNDE KUR (Apt-get yok, timeout yok)
      - name: FFmpeg Kurulumu
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          architecture: x64

      - name: Python bağımlılıkları
        timeout-minutes: 8
        run: |
          pip install -r mpt/requirements.txt
          pip install edge-tts

      - name: Render + Telegram
        working-directory: mpt
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python ../render.py

      - name: Çökme/zaman aşımı bildirimi
        if: failure() || cancelled()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="❌ Video işi çöktü veya iptal oldu: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
