name: Video Uretimi

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Video verileri (JSON)'
        required: true

# Aynı anda 1 çalışan + en fazla 1 bekleyen iş. Fazlası iptal edilir (ucuz bir hız sınırı).
concurrency:
  group: video-uret
  cancel-in-progress: false

env:
  # Tag/branch değil, commit SHA'sına sabitle: upstream kırılırsa gece yarısı bot ölmesin.
  MPT_REF: f063a2b95e0f71f60891ac1c7b53add684bc6a46

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 360 değil! Takılan iş 6 saat dakika yakmasın.
    steps:
      - uses: actions/checkout@v4          # render.py bu repoda

      - uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          ref: ${{ env.MPT_REF }}
          path: mpt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mpt/requirements.txt

      - name: Bağımlılıklar (cache'li)
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -r mpt/requirements.txt

      - name: Render + Telegram
        working-directory: mpt
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python ../render.py

      - name: Çökme/zaman aşımı bildirimi
        if: failure() || cancelled()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="❌ Video işi çöktü veya iptal oldu: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
